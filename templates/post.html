{% extends "base.html" %}
{% block  title%}
<style>
    h1{text-align: center;}
    table,th,td{
        border: 1px solid black;
        border-collapse: collapse;
        padding: 5px;
        text-align: center;
    }
    h1, table{
        margin-left: auto;
        margin-right: auto;
    }
</style>

{% endblock  %}
{% block  content%}
<h1>學生資料管理系統-新增資料</h1>
    <form action="/post/" method="post">
        {% csrf_token %}
        <table>
            
            <tr>
                <th>*姓名 </th>
                <td><input type="text" id="cName" name="cName" required></td>
            </tr>
            <tr>
                <th>*性別 </th>
                <td>
                    <input type="radio" id="cSexM" name="cSex" value="M" checked>
                    <label for="cSexM">男</label>
                    <input type="radio" id="cSexF" name="cSex" value="F">
                    <label for="cSexF">女</label>                    
                </td>
            </tr>
            <tr>
                <th>*生日 </th>
                <td><input type="date" id="cBirthday" name="cBirthday" required></td>
            </tr>
            <tr>
                <th>*信箱 </th>
                <td><input type="email" name="cEmail" id="cEmail" required></td>
            </tr>
            <tr>
                <th>電話</th>
                <td><input type="text" name="cPhone" id="cPhone"></td>
            </tr>
            <tr>
                <th>地址 </th>
                <td><input type="text" name="cAddr" id="cAddr"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="新增">
                    <input type="reset" value="清除">
                </td>
            </tr>


        </table>

{% endblock  %}
